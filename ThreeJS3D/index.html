<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js 模型加载与动画演示</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
        }
        #controls {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 12px;
            color: white;
            z-index: 100;
            min-width: 280px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        #controls h2 {
            margin-bottom: 15px;
            font-size: 18px;
            color: #00d4ff;
        }
        .control-group {
            margin-bottom: 15px;
        }
        .control-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #aaa;
        }
        button {
            background: #00d4ff;
            color: #1a1a2e;
            border: none;
            padding: 10px 20px;
            margin: 5px 5px 5px 0;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        button:hover {
            background: #00a8cc;
            transform: translateY(-2px);
        }
        button:disabled {
            background: #555;
            cursor: not-allowed;
            transform: none;
        }
        button.active {
            background: #ff6b6b;
        }
        input[type="range"] {
            width: 100%;
            margin: 10px 0;
            accent-color: #00d4ff;
        }
        .speed-value {
            text-align: center;
            font-size: 14px;
            color: #00d4ff;
        }
        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            z-index: 200;
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #00d4ff;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        select {
            width: 100%;
            padding: 8px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <div>加载模型中...</div>
    </div>
    <div id="canvas-container"></div>
    <div id="controls">
        <h2>🎬 动画控制面板</h2>
        <div class="control-group">
            <label>播放控制</label>
            <button id="playBtn">▶ 播放</button>
            <button id="pauseBtn">⏸ 暂停</button>
            <button id="resetBtn">↺ 重置</button>
        </div>
        <div class="control-group">
            <label>动画剪辑</label>
            <select id="animationSelect"></select>
        </div>
        <div class="control-group">
            <label>播放速度</label>
            <input type="range" id="speedSlider" min="0" max="3" step="0.1" value="1">
            <div class="speed-value" id="speedValue">1.0x</div>
        </div>
        <div class="control-group">
            <label>循环模式</label>
            <button id="loopBtn" class="active">🔄 循环</button>
            <button id="onceBtn">➡ 单次</button>
        </div>
        <div class="control-group">
            <label>其他操作</label>
            <button id="screenshotBtn">📷 截图</button>
        </div>
    </div>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <script type="module" src="main.js"></script>
</body>
</html>
