<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TCP客户端模拟</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>TCP客户端模拟</h1>
            <p>客户端视角下的TCP通信</p>
        </header>

        <div class="main-content">
            <nav class="main-nav">
                <a href="index.html" class="nav-item">
                    <div class="nav-icon">📊</div>
                    <div class="nav-title">总览</div>
                    <div class="nav-desc">完整TCP通信流程</div>
                </a>
                <a href="client.html" class="nav-item active">
                    <div class="nav-icon">💻</div>
                    <div class="nav-title">客户端</div>
                    <div class="nav-desc">客户端视角</div>
                </a>
                <a href="server.html" class="nav-item">
                    <div class="nav-icon">🖥️</div>
                    <div class="nav-title">服务端</div>
                    <div class="nav-desc">服务端视角</div>
                </a>
            </nav>

            <div class="client-section">
                <div class="machine-panel">
                    <div class="panel-header">
                    <div class="machine-icon-large">💻</div>
                    <div>
                    <h2>客户端</h2>
                    <p>192.168.1.100:54321</p>
                    </div>
                    <div class="status-badge" id="clientStatus">CLOSED</div>
                </div>

                <div class="client-controls">
                    <button id="connectBtn" class="btn btn-primary">连接服务器</button>
                    <button id="sendDataBtn" class="btn" disabled>发送数据</button>
                    <button id="closeBtn" class="btn btn-danger" disabled>关闭连接</button>
                </div>

                <div class="input-area">
                    <label>要发送的数据:</label>
                    <textarea id="dataInput" placeholder="输入要发送的消息..." disabled>Hello, Server!</textarea>
                </div>

                <div class="log-panel">
                    <h3>客户端状态转换</h3>
                    <div class="state-transition">
                        <div class="state-dot" data-state="CLOSED">
                            <span class="dot active"></span>
                            <span>CLOSED</span>
                        </div>
                        <div class="arrow">→</div>
                        <div class="state-dot" data-state="SYN_SENT">
                            <span class="dot"></span>
                            <span>SYN_SENT</span>
                        </div>
                        <div class="arrow">→</div>
                        <div class="state-dot" data-state="ESTABLISHED">
                            <span class="dot"></span>
                            <span>ESTABLISHED</span>
                        </div>
                        <div class="arrow">→</div>
                        <div class="state-dot" data-state="FIN_WAIT_1">
                            <span class="dot"></span>
                            <span>FIN_WAIT_1</span>
                        </div>
                        <div class="arrow">→</div>
                        <div class="state-dot" data-state="FIN_WAIT_2">
                            <span class="dot"></span>
                            <span>FIN_WAIT_2</span>
                        </div>
                        <div class="arrow">→</div>
                        <div class="state-dot" data-state="TIME_WAIT">
                            <span class="dot"></span>
                            <span>TIME_WAIT</span>
                        </div>
                    </div>
                </div>

                <div class="log-panel">
                    <h3>报文收发记录</h3>
                    <div class="packet-log" id="packetLog">
                        <div class="log-empty">等待连接...</div>
                    </div>
                </div>

                <div class="log-panel">
                    <h3>详细日志</h3>
                    <div class="detail-log" id="detailLog">
                        <div class="log-entry">[系统] 客户端已启动，等待用户操作...</div>
                    </div>
                </div>
                </div>
            </div>
        </div>
    </div>

    <script src="client.js"></script>
</body>
</html>
