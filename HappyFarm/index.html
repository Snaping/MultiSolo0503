<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>欢乐农场</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            font-family: 'Microsoft YaHei', sans-serif;
        }
        #game-container {
            width: 100vw;
            height: 100vh;
        }
        #ui-overlay {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
        }
        #user-info {
            background: rgba(0,0,0,0.6);
            padding: 15px 20px;
            border-radius: 12px;
            margin-bottom: 10px;
            backdrop-filter: blur(5px);
        }
        #user-name {
            font-size: 22px;
            font-weight: bold;
            color: #4ade80;
        }
        #user-coins {
            font-size: 18px;
            color: #fbbf24;
            margin-top: 5px;
        }
        #growth-control {
            background: rgba(0,0,0,0.6);
            padding: 12px 15px;
            border-radius: 10px;
            margin-top: 10px;
            backdrop-filter: blur(5px);
        }
        #growth-control label {
            font-size: 14px;
            color: #fff;
        }
        #growth-speed {
            width: 100px;
            margin: 8px 0;
            cursor: pointer;
        }
        #growth-value {
            font-size: 16px;
            color: #4ade80;
            font-weight: bold;
        }
        #controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 100;
        }
        .plant-btn {
            padding: 12px 18px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: bold;
            cursor: grab;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 75px;
            user-select: none;
        }
        .plant-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }
        .plant-btn.selected {
            outline: 3px solid white;
            outline-offset: 2px;
            transform: scale(1.1);
        }
        .plant-btn:active {
            cursor: grabbing;
        }
        .plant-btn .price {
            font-size: 11px;
            margin-top: 4px;
        }
        .plant-btn .value {
            font-size: 9px;
            color: rgba(255,255,255,0.8);
        }
        .plant-carrot { background: linear-gradient(135deg, #fb923c, #ea580c); color: white; }
        .plant-tomato { background: linear-gradient(135deg, #ef4444, #dc2626); color: white; }
        .plant-corn { background: linear-gradient(135deg, #facc15, #eab308); color: #333; }
        .plant-watermelon { background: linear-gradient(135deg, #22c55e, #16a34a); color: white; }
        .plant-sunflower { background: linear-gradient(135deg, #eab308, #ca8a04); color: #333; }
        .plant-eggplant { background: linear-gradient(135deg, #8b5cf6, #7c3aed); color: white; }
        #instructions {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.6);
            padding: 15px;
            border-radius: 12px;
            color: white;
            font-size: 13px;
            z-index: 100;
            backdrop-filter: blur(5px);
            line-height: 1.8;
        }
        #notification {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.85);
            color: white;
            padding: 25px 50px;
            border-radius: 15px;
            font-size: 24px;
            z-index: 200;
            display: none;
            text-align: center;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255,255,255,0.1);
        }
        #notification .coins {
            color: #fbbf24;
            font-size: 32px;
            font-weight: bold;
            margin-top: 10px;
        }
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            color: white;
        }
        #loading h1 {
            font-size: 56px;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(74, 222, 128, 0.5);
        }
        #loading p {
            font-size: 24px;
            color: #4ade80;
        }
        .hidden { display: none !important; }
        #gallery-btn {
            position: fixed;
            top: 20px;
            right: 200px;
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            z-index: 100;
            transition: all 0.3s;
        }
        #gallery-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(139, 92, 246, 0.4);
        }
        #gallery-panel {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(30, 30, 50, 0.95);
            padding: 30px;
            border-radius: 20px;
            z-index: 300;
            display: none;
            min-width: 400px;
            max-width: 500px;
            max-height: 70vh;
            overflow-y: auto;
            border: 2px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
        }
        #gallery-panel h2 {
            color: white;
            text-align: center;
            margin-bottom: 20px;
            font-size: 28px;
        }
        #gallery-panel .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            background: none;
            border: none;
            color: white;
            font-size: 28px;
            cursor: pointer;
        }
        #gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }
        .gallery-item {
            background: rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            transition: all 0.3s;
        }
        .gallery-item:hover {
            background: rgba(255,255,255,0.2);
            transform: translateY(-3px);
        }
        .gallery-emoji {
            font-size: 48px;
            margin-bottom: 8px;
        }
        .gallery-count {
            font-size: 18px;
            color: #fbbf24;
            font-weight: bold;
        }
        .gallery-name {
            font-size: 14px;
            color: #ccc;
            margin-top: 5px;
        }
        .gallery-empty {
            grid-column: 1 / -1;
            text-align: center;
            color: #888;
            padding: 40px;
            font-size: 18px;
        }
        #harvest-hint {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(34, 197, 94, 0.9);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            z-index: 100;
            display: none;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="loading">
        <h1>🌾 欢乐农场 🌾</h1>
        <p>正在加载...</p>
    </div>
    <div id="game-container"></div>
    <div id="ui-overlay">
        <div id="user-info">
            <div id="user-name">农场主</div>
            <div id="user-coins">💰 金币: 100</div>
        </div>
        <div id="growth-control">
            <label>🌱 生长速度</label><br>
            <input type="range" id="growth-speed" min="0.5" max="5" step="0.1" value="1">
            <div id="growth-value">1.0x</div>
        </div>
    </div>
    <button id="gallery-btn">🎒 背包</button>
    <div id="instructions">
        <p>🎮 WASD / 方向键 - 移动</p>
        <p>🌱 拖拽种子到土地播种</p>
        <p>🖱️ 鼠标悬停成熟作物点击采摘</p>
        <p>💡 作物发光表示成熟</p>
    </div>
    <div id="controls">
        <button class="plant-btn plant-carrot" data-plant="carrot" data-price="10" data-value="25">
            🥕 胡萝卜
            <span class="price">💰 10</span>
            <span class="value">收益 25</span>
        </button>
        <button class="plant-btn plant-tomato" data-plant="tomato" data-price="15" data-value="40">
            🍅 番茄
            <span class="price">💰 15</span>
            <span class="value">收益 40</span>
        </button>
        <button class="plant-btn plant-corn" data-plant="corn" data-price="20" data-value="55">
            🌽 玉米
            <span class="price">💰 20</span>
            <span class="value">收益 55</span>
        </button>
        <button class="plant-btn plant-watermelon" data-plant="watermelon" data-price="30" data-value="80">
            🍉 西瓜
            <span class="price">💰 30</span>
            <span class="value">收益 80</span>
        </button>
        <button class="plant-btn plant-sunflower" data-plant="sunflower" data-price="25" data-value="65">
            🌻 向日葵
            <span class="price">💰 25</span>
            <span class="value">收益 65</span>
        </button>
        <button class="plant-btn plant-eggplant" data-plant="eggplant" data-price="35" data-value="95">
            🍆 茄子
            <span class="price">💰 35</span>
            <span class="value">收益 95</span>
        </button>
    </div>
    <div id="notification">
        <div id="notification-text"></div>
        <div class="coins" id="notification-coins"></div>
    </div>
    <div id="gallery-panel">
        <button class="close-btn" onclick="document.getElementById('gallery-panel').style.display='none'">&times;</button>
        <h2>🎒 我的背包</h2>
        <div id="gallery-grid">
            <div class="gallery-empty">背包空空如也，快去种植吧！</div>
        </div>
    </div>
    <script type="module" src="/src/main.js"></script>
    <script>
        document.getElementById('gallery-btn').addEventListener('click', () => {
            const panel = document.getElementById('gallery-panel');
            panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
        });

        document.getElementById('growth-speed').addEventListener('input', (e) => {
            const value = parseFloat(e.target.value);
            document.getElementById('growth-value').textContent = value.toFixed(1) + 'x';
            if (window.game) {
                window.game.growthSpeed = value;
                window.game.saveUserData();
            }
        });

        // 检查和清理可能有问题的localStorage数据
        try {
            const saved = localStorage.getItem('happyFarmUser');
            if (saved) {
                const data = JSON.parse(saved);
                // 验证数据完整性
                if (data.user && typeof data.user.coins === 'number') {
                    console.log('数据加载正常');
                } else {
                    console.log('数据格式有问题，重置为默认值');
                    localStorage.removeItem('happyFarmUser');
                }
            }
        } catch (e) {
            console.error('数据解析错误，清理旧数据', e);
            localStorage.removeItem('happyFarmUser');
        }
    </script>
</body>
</html>
