<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三国迷宫 - Three Kingdoms Maze</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            font-family: 'Microsoft YaHei', sans-serif;
        }
        #game-container {
            width: 100vw;
            height: 100vh;
        }
        #ui-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        #hint-panel {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: #ffd700;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 18px;
            border: 2px solid #ffd700;
            max-width: 80%;
            text-align: center;
        }
        #dialog-box {
            position: fixed;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 30px;
            border-radius: 15px;
            border: 3px solid #8b4513;
            max-width: 600px;
            display: none;
            pointer-events: auto;
        }
        #dialog-box h3 {
            color: #ffd700;
            margin-bottom: 15px;
            font-size: 24px;
        }
        #dialog-box p {
            margin-bottom: 20px;
            font-size: 16px;
            line-height: 1.6;
        }
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .option-btn {
            background: linear-gradient(135deg, #8b4513, #a0522d);
            color: white;
            border: 2px solid #ffd700;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
        }
        .option-btn:hover {
            background: linear-gradient(135deg, #a0522d, #cd853f);
            transform: scale(1.02);
        }
        #level-info {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            color: #ffd700;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 16px;
        }
        #controls-hint {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 14px;
        }
        #start-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a0a00, #2d1810);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        #start-screen h1 {
            color: #ffd700;
            font-size: 48px;
            margin-bottom: 20px;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.8);
        }
        #start-screen p {
            color: #d2b48c;
            font-size: 18px;
            margin-bottom: 30px;
            text-align: center;
            max-width: 500px;
        }
        #start-btn {
            background: linear-gradient(135deg, #8b4513, #a0522d);
            color: white;
            border: 3px solid #ffd700;
            padding: 15px 50px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 24px;
            transition: all 0.3s;
        }
        #start-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
        }
        .result-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            padding: 40px;
            border-radius: 15px;
            border: 4px solid #ffd700;
            text-align: center;
            display: none;
            z-index: 200;
        }
        .result-message h2 {
            color: #ffd700;
            font-size: 36px;
            margin-bottom: 20px;
        }
        .result-message p {
            color: white;
            font-size: 18px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div id="start-screen">
        <h1>🔺 三国迷宫 🔻</h1>
        <p>在神秘的三国迷宫中寻找历史人物，回答他们的问题，探索更多关卡！</p>
        <button id="start-btn">开始游戏</button>
    </div>
    
    <div id="game-container"></div>
    
    <div id="ui-overlay">
        <div id="hint-panel"></div>
        <div id="level-info">关卡: 1</div>
        <div id="controls-hint">WASD移动 | 空格对话 | 鼠标视角</div>
    </div>
    
    <div id="dialog-box">
        <h3 id="npc-name"></h3>
        <p id="npc-dialog"></p>
        <div class="options-container" id="options-container"></div>
    </div>
    
    <div id="result-message" class="result-message">
        <h2 id="result-title"></h2>
        <p id="result-text"></p>
        <button class="option-btn" id="result-btn">继续</button>
    </div>

    <script type="module" src="/main.js"></script>
</body>
</html>
